<!doctype html><html><head><meta charset="UTF-8"><title>Bounded SDF water and volume validation</title><style>body{margin:0;background:#1b2630}canvas{width:640px;height:360px;display:block}</style></head><body><canvas id="view"></canvas><script type="module">
import * as THREE from 'three';
import {VoxelField} from '/src/prototype/core/voxel.ts';
import {VoxelWater} from '/src/prototype/core/water.ts';
import {createWaterVolumeView} from '/src/prototype/rendering/water-volume-view.ts';
import {createVolumeScenePipeline} from '/src/rendering/volumetrics/scene-pipeline.ts';
const canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:false,preserveDrawingBuffer:true});renderer.setSize(640,360,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();scene.background=new THREE.Color('#8bafbf');const camera=new THREE.PerspectiveCamera(65,640/360,.035,50);camera.position.set(7,2.1,3);camera.lookAt(7,-.2,-2);
const floor=new THREE.Mesh(new THREE.BoxGeometry(15,.15,15),new THREE.MeshBasicMaterial({color:'#8b795a'}));floor.position.set(6,-.6,-2);scene.add(floor);
for(let i=0;i<7;i++){const rock=new THREE.Mesh(new THREE.BoxGeometry(.3,.45,.3),new THREE.MeshBasicMaterial({color:i%2?'#c69763':'#36504b'}));rock.position.set(4.6+i*.6,-.22,-1.5);scene.add(rock);}
const w=new VoxelWater(new VoxelField());w.volume.fill(0);for(let z=2;z<46;z++)for(let x=2;x<46;x++)for(let y=0;y<4;y++)w.volume[w.index(x,y,z)]=1;
const view=createWaterVolumeView(w,camera);scene.add(view.mesh);const pipeline=createVolumeScenePipeline(renderer,scene,camera,{density:.008,ambient:new THREE.Color('#8298b2'),direction:new THREE.Vector3(.3,.8,.4).normalize(),points:[],groundHeight:-.6},[{min:[4,-.5,-5],max:[9,2,-3.8],density:.25}],view);pipeline.resize(640,360);
const clearPipeline=createVolumeScenePipeline(renderer,scene,camera,{density:0,ambient:new THREE.Color('#8298b2'),direction:new THREE.Vector3(.3,.8,.4).normalize(),points:[],groundHeight:-.6},[],view);clearPipeline.resize(640,360);
function pixels(){const gl=renderer.getContext(),data=new Uint8Array(canvas.width*canvas.height*4);gl.readPixels(0,0,canvas.width,canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,data);return data;}
function difference(a,b){let changed=0;for(let i=0;i<a.length;i+=4)if(Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2])>6)changed++;return changed;}

function draw(frames=1){for(let i=0;i<frames;i++){view.update(1/60);pipeline.render(1/60);}}
function restoreFull(){w.volume.fill(0);for(let z=2;z<46;z++)for(let x=2;x<46;x++)for(let y=0;y<4;y++)w.volume[w.index(x,y,z)]=1;w.revision++;view.update(.1);}
window.__waterHarness={renderer,scene,camera,water:w,view,draw,
 hdrStats(){const target=pipeline.volume.target,half=target.texture.type===THREE.HalfFloatType,data=half?new Uint16Array(target.width*target.height*4):new Uint8Array(target.width*target.height*4);renderer.readRenderTargetPixels(target,0,0,target.width,target.height,data);let invalid=0,negative=0,invalidAlpha=0;for(let i=0;i<data.length;i++){const value=half?THREE.DataUtils.fromHalfFloat(data[i]):data[i]/255;if(!Number.isFinite(value))invalid++;if(i%4===3){if(value<0||value>1)invalidAlpha++;}else if(value<0)negative++;}return {invalid,negative,invalidAlpha};},
 compareLayers(){draw();const both=pixels();view.mesh.visible=false;pipeline.render(1/60);const noWater=pixels();view.mesh.visible=true;clearPipeline.render(1/60);const noFog=pixels();draw();return {waterPixels:difference(both,noWater),fogPixels:difference(both,noFog)};},
 pixelStats(){const data=pixels();let nonBlack=0,total=0;for(let i=0;i<data.length;i+=4){const energy=data[i]+data[i+1]+data[i+2];if(energy>12)nonBlack++;total+=energy;}return {nonBlack,mean:total/(data.length/4)/3,pixels:data.length/4};},
 underwater(){restoreFull();camera.position.set(7,-.15,-2);camera.lookAt(7,.4,-5);draw(12);},
 floor(){restoreFull();camera.position.set(7,-.15,-2);camera.lookAt(7,-.5,-2.5);draw(12);},
 shallow(){w.volume.fill(0);for(let z=2;z<46;z++)for(let x=2;x<46;x++)w.volume[w.index(x,0,z)]=.1;w.revision++;draw(12);},
 dry(){w.volume.fill(0);w.revision++;draw(12);},
 resize(){renderer.setSize(480,270,false);canvas.style.width='480px';canvas.style.height='270px';camera.aspect=480/270;camera.updateProjectionMatrix();pipeline.resize(480,270);clearPipeline.resize(480,270);draw();},
 input(){view.interact(6.9,0,-2);view.interact(7.1,0,-2);draw(30);},
 stats:()=>({...view.stats,...pipeline.stats,programs:renderer.info.programs?.length??0,error:renderer.getContext().getError()})};
draw();
</script></body></html>
