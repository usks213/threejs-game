name: Game CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: game-ci-scoped-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      game: ${{ steps.scope.outputs.game }}
      checks: ${{ steps.scope.outputs.checks }}
      signaling: ${{ steps.scope.outputs.signaling }}
      network: ${{ steps.scope.outputs.network }}
      host: ${{ steps.scope.outputs.host }}
      browser: ${{ steps.scope.outputs.browser }}
      browser_grep: ${{ steps.scope.outputs.browser_grep }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Select checks for this push
        id: scope
        run: node scripts/ci-scope.mjs
        env:
          CHECKED_OUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.checks == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.checks == 'true'
      - run: npm run typecheck
        if: steps.scope.outputs.checks == 'true'
      - name: Unit tests without socket integration
        if: steps.scope.outputs.checks == 'true' && steps.scope.outputs.network != 'true'
        run: npm run test -- --exclude tests/unit/dedicated.test.ts
      - name: Unit tests including real multiplayer connections
        if: steps.scope.outputs.network == 'true'
        run: npm run test
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.network == 'true'
        with:
          name: simulation-benchmarks
          path: test-results/dedicated-load.json
          retention-days: 7
      - run: npm run build
        if: steps.scope.outputs.game == 'true'
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.game == 'true'
        with:
          name: game-dist
          path: dist/
          retention-days: 7

  e2e:
    # Full browser regression runs on main or explicit dispatch, outside the preview loop.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --project=desktop-chromium --project=android-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  iphone-webkit-smoke:
    # One selected engine smoke, not a full browser matrix or physical iPhone test.
    # Reuse the exact verified build and never make preview publication wait for it.
    if: needs.verify.outputs.game == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist/
      - run: npx playwright install --with-deps webkit
      - name: Serve the verified build and run the bounded WebKit smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/webkit-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; cat /tmp/webkit-preview.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          npm run e2e -- --project=iphone-webkit --workers=1 --retries=0 --global-timeout=240000
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-webkit-smoke
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare published this exact commit
        run: node scripts/check-deployment.mjs

  deploy-preview:
    # Only same-repository PRs may use the deployment credential.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.verify.outputs.game == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist/
      - name: Publish the verified build directly to Cloudflare Preview
        run: node scripts/deploy-coop-preview.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c3ca485329f03044432fbd5164083278
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: preview-release
          path: preview-release.json
          retention-days: 7

  review-smoke:
    # Only browser cases relevant to this push; never blocks deploy-preview.
    if: github.event_name == 'pull_request' && needs.verify.outputs.browser == 'true'
    needs: verify
    runs-on: ubuntu-latest
    # Allow the added fixed-DPR art captures plus existing gameplay/HDR checks.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --project=android-chromium --retries=0 --grep "$BROWSER_GREP"
        env:
          BROWSER_GREP: ${{ needs.verify.outputs.browser_grep }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-review-smoke
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop-adventure-feedback:
    # Bounded PC input coverage for the mobile-menu/debug-flight feedback.
    # Reuse the verified build; leave the full browser matrix opt-in.
    if: github.event_name == 'pull_request' && needs.verify.outputs.game == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - name: Check menu wheel and debug-flight keyboard controls
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/feedback-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; cat /tmp/feedback-preview.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          npm run e2e -- --project=desktop-chromium --workers=1 --retries=0 --grep 'menu scrolling|debug flight' --global-timeout=360000
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-adventure-feedback
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy-signaling:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.verify.outputs.signaling == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish free-plan SQLite signaling service
        run: npx --yes wrangler@4.147.0 deploy --config apps/signaling/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c3ca485329f03044432fbd5164083278
      - name: Check signaling health
        run: node scripts/check-signaling.mjs

  host-session:
    if: always() && github.event_name == 'pull_request' && needs.verify.result == 'success' && needs.verify.outputs.host == 'true' && (needs.deploy-signaling.result == 'success' || needs.deploy-signaling.result == 'skipped')
    needs: [verify, deploy-signaling]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start real local authority
        run: npm run coop:local > /tmp/coop-local.log 2>&1 &
      - run: npm run e2e -- --project=desktop-chromium --grep 'two real browsers'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-session-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7


  desktop-controls:
    if: github.event_name == 'pull_request' && contains(needs.verify.outputs.browser_grep, 'core landscape')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install native X11 test input from Ubuntu packages
        run: sudo apt-get install --yes --no-install-recommends xdotool xvfb xauth x11-utils
      - name: Verify desktop controls with headed Chromium and native relative mouse input
        # Playwright headed Linux: https://playwright.dev/docs/ci#running-headed
        # Each job gets one isolated display and one input-owning browser worker.
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' sh -c '
            xdpyinfo -queryExtensions | grep -w XTEST &&
            xdotool version &&
            npm run e2e -- --headed --workers=1 --retries=0 --project=desktop-chromium --grep "desktop mouse"
          '
        env:
          E2E_NATIVE_MOUSE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-controls
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  public-coop:
    if: github.event_name == 'pull_request'
    needs: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: preview-release
      - run: npx playwright install --with-deps chromium
      - name: Probe public authority without GPU dependencies
        run: E2E_BASE_URL=$(node -p "JSON.parse(require('fs').readFileSync('preview-release.json')).url") node --import tsx scripts/probe-public-coop.mjs
      - name: Test two independent browsers against the public authority
        run: E2E_BASE_URL=$(node -p "JSON.parse(require('fs').readFileSync('preview-release.json')).url") npm run e2e -- --project=desktop-chromium --grep 'two real browsers' --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-coop-evidence
          path: |
            playwright-report/
            test-results/


  public-coop-load:
    # Bounded measurement only on the existing free preview; no load generator service.
    # Browser rooms share this Worker script. Measure after they close so their
    # unrelated authority work does not confound this four-client baseline.
    if: always() && !cancelled() && github.event_name == 'pull_request' && needs.deploy-preview.result == 'success'
    needs: [deploy-preview, public-coop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: preview-release
      - name: Measure four actual preview clients for sixty seconds
        run: E2E_BASE_URL=$(node -p "JSON.parse(require('fs').readFileSync('preview-release.json')).url") node --import tsx scripts/probe-public-coop-load.ts
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-coop-load-evidence
          path: test-results/public-coop-load.json
          retention-days: 7
