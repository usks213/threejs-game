name: Voxel Core CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voxel-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR4_CAMPAIGN_RELAY_ENABLED: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 4 && 'true' || 'false' }}
      - uses: actions/upload-artifact@v4
        with:
          name: game-dist
          path: dist/
          retention-days: 7
  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            group: desktop-input
            cases: landscape|portrait
          - project: desktop-chromium
            group: desktop-motion
            cases: motion review
          - project: desktop-chromium
            group: desktop-duel
            cases: desktop duel
          - project: desktop-chromium
            group: desktop-sdf
            cases: desktop SDF
          - project: desktop-chromium
            group: desktop-elements
            cases: elemental
          - project: android-chromium
            group: android-chromium
            cases: landscape|portrait|motion review|desktop
          - project: android-chromium
            group: android-elements
            cases: elemental
          - project: desktop-chromium
            group: desktop-campaign
            cases: campaign
          - project: android-chromium
            group: android-campaign
            cases: campaign
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --project="${{ matrix.project }}" --grep="${{ matrix.cases }}" --grep-invert="campaign first chapter|cooperation integration"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-browser-results-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  deploy-preview:
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist/
      - run: node scripts/deploy-preview.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c3ca485329f03044432fbd5164083278
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR4_CAMPAIGN_RELAY_ENABLED: ${{ github.event.pull_request.number == 4 && 'true' || 'false' }}
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: preview-release
          path: preview-release.json
          retention-days: 7
  first-chapter-browser:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, android-chromium]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --project="${{ matrix.project }}" --grep="campaign first chapter"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-chapter-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  cooperative-browser:
    needs: [verify, deploy-preview]
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --project=desktop-chromium --grep="cooperation integration"
        env:
          E2E_BASE_URL: https://pr-4-threejs-game.usks213.workers.dev
          E2E_COOP: '1'
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cooperative-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  verify-production:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-deployment.mjs
