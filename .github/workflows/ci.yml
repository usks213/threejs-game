name: Voxel Core CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voxel-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    outputs:
      legacy: ${{ steps.scope.outputs.legacy }}
      cooperative: ${{ steps.scope.outputs.cooperative }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: scope
        run: node scripts/dungeon-test-scope.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR4_CAMPAIGN_RELAY_ENABLED: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 4 && 'true' || 'false' }}
      - uses: actions/upload-artifact@v4
        with:
          name: game-dist
          path: dist/
          retention-days: 7
  browser:
    if: needs.verify.outputs.legacy == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            group: desktop-input
          - project: desktop-chromium
            group: desktop-motion
          - project: desktop-chromium
            group: desktop-duel
          - project: desktop-chromium
            group: desktop-sdf
          - project: desktop-chromium
            group: desktop-elements
          - project: android-chromium
            group: android-chromium
          - project: android-chromium
            group: android-elements
          - project: desktop-chromium
            group: desktop-campaign
          - project: desktop-chromium
            group: desktop-campaign-ui
          - project: desktop-chromium
            group: desktop-echo-vault
          - project: desktop-chromium
            group: desktop-soil-life
          - project: desktop-chromium
            group: desktop-watermill
          - project: desktop-chromium
            group: desktop-collectible-display
          - project: desktop-chromium
            group: desktop-skill-gems
          - project: desktop-chromium
            group: desktop-inventory-stacks
          - project: desktop-chromium
            group: desktop-player-rest
          - project: desktop-chromium
            group: desktop-mist
          - project: desktop-chromium
            group: desktop-equipment-tools
          - project: desktop-chromium
            group: desktop-discovery-controls
          - project: desktop-chromium
            group: desktop-campaign-save
          - project: desktop-chromium
            group: desktop-campaign-migration
          - project: android-chromium
            group: android-campaign
          - project: android-chromium
            group: android-campaign-ui
          - project: android-chromium
            group: android-echo-vault
          - project: android-chromium
            group: android-soil-life
          - project: android-chromium
            group: android-watermill
          - project: android-chromium
            group: android-collectible-display
          - project: android-chromium
            group: android-skill-gems
          - project: android-chromium
            group: android-inventory-stacks
          - project: android-chromium
            group: android-player-rest
          - project: android-chromium
            group: android-mist
          - project: android-chromium
            group: android-equipment-tools
          - project: android-chromium
            group: android-discovery-controls
          - project: android-chromium
            group: android-campaign-save
          - project: android-chromium
            group: android-campaign-migration
    needs: verify
    runs-on: ubuntu-latest
    # The bed case already owns a20-minute test deadline. Setup/upload need
    # separate job margin; the test deadline and assertions stay unchanged.
    timeout-minutes: ${{ (matrix.group == 'desktop-player-rest' || matrix.group == 'android-player-rest') && 25 || 20 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - name: Install native X11 test input from Ubuntu packages
        if: matrix.project == 'desktop-chromium'
        run: sudo apt-get install --yes --no-install-recommends xdotool xvfb xauth x11-utils
      - name: Run desktop group with native input in headed Chromium
        if: matrix.project == 'desktop-chromium'
        run: bash scripts/run-native-browser.sh node scripts/run-browser-group.mjs "${{ matrix.project }}" "${{ matrix.group }}"
      - run: node scripts/run-browser-group.mjs "${{ matrix.project }}" "${{ matrix.group }}"
        if: matrix.project == 'android-chromium'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-browser-results-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  mobile-webkit-browser:
    if: needs.verify.outputs.legacy == 'true'
    # Bounded mobile engine acceptance, independent of Chromium/CDP and preview.
    # Linux WebKit emulation does not establish physical iPhone/Safari or FPS.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist/
      - run: npx playwright install --with-deps webkit
      - name: Verify WebKit rendering, touch menus, rotation and saved settings
        run: npm run e2e:webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-webkit-engine-results
          path: |
            playwright-report/webkit/
            test-results/webkit/
          retention-days: 7
  native-pointer-browser:
    if: needs.verify.outputs.legacy == 'true'
    # A focused native-input contract; each desktop job owns its X11 display.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - name: Install native X11 test input from Ubuntu packages
        run: sudo apt-get install --yes --no-install-recommends xdotool xvfb xauth x11-utils
      - name: Verify native relative mouse and held combat in headed Chromium
        # Playwright headed Linux: https://playwright.dev/docs/ci#running-headed
        run: bash scripts/run-native-browser.sh npm run e2e -- tests/e2e/native-pointer.spec.ts --project=desktop-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pointer-desktop
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  deploy-preview:
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist/
      - run: node scripts/deploy-preview.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c3ca485329f03044432fbd5164083278
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR4_CAMPAIGN_RELAY_ENABLED: ${{ github.event.pull_request.number == 4 && 'true' || 'false' }}
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: preview-release
          path: preview-release.json
          retention-days: 7
  first-chapter-browser:
    if: needs.verify.outputs.legacy == 'true'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, android-chromium]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - name: Install native X11 test input from Ubuntu packages
        if: matrix.project == 'desktop-chromium'
        run: sudo apt-get install --yes --no-install-recommends xdotool xvfb xauth x11-utils
      - name: Run desktop first chapter with native input in headed Chromium
        if: matrix.project == 'desktop-chromium'
        run: bash scripts/run-native-browser.sh npm run e2e -- --project="${{ matrix.project }}" --grep="campaign first chapter"
      - run: npm run e2e -- --project="${{ matrix.project }}" --grep="campaign first chapter"
        if: matrix.project == 'android-chromium'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-chapter-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  combat-build-browser:
    if: needs.verify.outputs.legacy == 'true'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, android-chromium]
        build: [bow, staff]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - name: Install native X11 test input from Ubuntu packages
        if: matrix.project == 'desktop-chromium'
        run: sudo apt-get install --yes --no-install-recommends xdotool xvfb xauth x11-utils
      - name: Run desktop combat build with native input in headed Chromium
        if: matrix.project == 'desktop-chromium'
        run: bash scripts/run-native-browser.sh npm run e2e -- tests/e2e/campaign-combat-builds.spec.ts --project="${{ matrix.project }}" --grep="Q03 ${{ matrix.build }}:"
      - run: npm run e2e -- tests/e2e/campaign-combat-builds.spec.ts --project="${{ matrix.project }}" --grep="Q03 ${{ matrix.build }}:"
        if: matrix.project == 'android-chromium'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-build-${{ matrix.project }}-${{ matrix.build }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  regional-campaign-browser:
    # A separate end-to-end campaign budget. Existing short/chapter jobs and
    # their assertions/timeouts are unchanged. Android runs independently below.
    needs: verify
    if: needs.verify.outputs.legacy == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.number == 4)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - name: Install native X11 test input from Ubuntu packages
        run: sudo apt-get install --yes --no-install-recommends xdotool xvfb xauth x11-utils
      - name: Run desktop regional campaign with native input in headed Chromium
        run: bash scripts/run-native-browser.sh npm run e2e -- tests/e2e/campaign-regional-playthrough.spec.ts --project=desktop-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-campaign-desktop
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  regional-campaign-android-browser:
    # Same strict seven-region route with genuine CDP touches. Chromium mobile
    # emulation is independently reported; this is not Android device evidence.
    needs: verify
    if: needs.verify.outputs.legacy == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.number == 4)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- tests/e2e/campaign-touch-controls.spec.ts --project=android-chromium --output=touch-preflight-results
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: touch-preflight-report
      - run: npm run e2e -- tests/e2e/campaign-regional-playthrough.spec.ts --project=android-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-campaign-android-emulation
          path: |
            touch-preflight-report/
            touch-preflight-results/
            playwright-report/
            test-results/
          retention-days: 7
  streamed-world-browser:
    if: needs.verify.outputs.legacy == 'true'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, android-chromium]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - name: Install native X11 test input from Ubuntu packages
        if: matrix.project == 'desktop-chromium'
        run: sudo apt-get install --yes --no-install-recommends xdotool xvfb xauth x11-utils
      - name: Run desktop streamed campaign with native input in headed Chromium
        if: matrix.project == 'desktop-chromium'
        run: bash scripts/run-native-browser.sh npm run e2e -- --project="${{ matrix.project }}" --grep="streamed campaign"
      - run: npm run e2e -- --project="${{ matrix.project }}" --grep="streamed campaign"
        if: matrix.project == 'android-chromium'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamed-world-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  cooperative-browser:
    needs: [verify, deploy-preview]
    if: needs.verify.outputs.cooperative == 'true' && github.event_name == 'pull_request' && github.event.pull_request.number == 4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --project=desktop-chromium --grep="cooperation integration"
        env:
          E2E_BASE_URL: https://pr-4-threejs-game.usks213.workers.dev
          E2E_COOP: '1'
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cooperative-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  dungeon-browser:
    needs: [verify, deploy-preview]
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 4
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, android-chromium]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- tests/e2e/dungeon.spec.ts tests/e2e/dungeon-input.spec.ts tests/e2e/dungeon-resupply.spec.ts --project=${{ matrix.project }}
        env:
          E2E_BASE_URL: https://pr-4-threejs-game.usks213.workers.dev
          E2E_DUNGEON: '1'
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-browser-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  dungeon-raid-browser:
    needs: [verify, deploy-preview]
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 4
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- tests/e2e/dungeon-raid.spec.ts --project=desktop-chromium
        env:
          E2E_BASE_URL: https://pr-4-threejs-game.usks213.workers.dev
          E2E_DUNGEON: '1'
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-full-pvpve-browser
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  dungeon-return-browser:
    needs: [verify, deploy-preview]
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 4
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, android-chromium]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- tests/e2e/dungeon-pending-return.spec.ts --project=${{ matrix.project }}
        env:
          E2E_BASE_URL: https://pr-4-threejs-game.usks213.workers.dev
          E2E_DUNGEON: '1'
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-pending-return-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  dungeon-webkit-browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist/
      - run: npx playwright install --with-deps webkit
      - run: npm run e2e:webkit -- tests/webkit/dungeon.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-webkit-menu-smoke
          path: |
            playwright-report/webkit/
            test-results/webkit/
          retention-days: 7
  verify-production:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-deployment.mjs
